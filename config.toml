baseURL = "https://ppdms.gr"
title = "Basil Papadimas"
theme = "etch"
defaultContentLanguage = "en"

[languages.en]
  locale = "en-US"
enableInlineShortcodes = true
pygmentsCodeFences = true
pygmentsUseClasses = true

[params]
  description = "my home on the internet"
  dark = "auto"
  highlight = true
  cloudflare_analytics_token = "47d06284daa047e88682a5dd2e516207"

[permalinks]
  posts = "/:title/"

# Only publish page resources that are actually referenced (e.g. the resized
# image variants); keeps unreferenced multi-MB originals out of public/.
[[cascade]]
  [cascade.build]
    publishResources = false
  [cascade.target]
    kind = "page"

[[menu.main]]
  name = "Home"
  url = "/"
  weight = 1

[[menu.main]]
  name = "Backlinks"
  url = "/backlinks/"
  weight = 2

[[menu.main]]
  name = "Time"
  url = "/time/"
  weight = 3

[[menu.main]]
  name = "Gallery"
  url = "https://img.ppdms.gr"
  weight = 4

[module]
  [[module.imports]]
    path = 'github.com/hugomods/icons/vendors/bootstrap'
  [[module.imports]]
    path = 'github.com/hugomods/icons/vendors/mdi'
  [[module.imports]]
    path = 'github.com/hugomods/icons/vendors/font-awesome'

[markup.goldmark.renderer]
  # Allow HTML in Markdown
  unsafe = true

  [markup.tableOfContents]
    ordered = true
