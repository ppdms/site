title: Backlinks
description: Interesting content I’ve come across online. Inclusion doesn’t
  imply endorsement.
body: I’m going to periodically update this page with interesting content I’ve
  come across online. Inclusion here doesn’t necessarily imply endorsement, only
  that I found something to be thought provoking.
