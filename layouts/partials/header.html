{{ $page := . }}
<header id="banner">
    <div id="banner-inner">
        <div id="banner-identity">
            <a id="site-title" href="{{ .Site.BaseURL }}">{{ .Site.Title }}</a>
        </div>
        <nav id="toolbar">
            <ul>
                {{ range site.Menus.main.ByWeight -}}
                <li{{ if eq $page.RelPermalink .URL }} class="active"{{ end }}>
                    {{ .Pre }}<a href="{{ .URL }}" title="{{ .Title }}">{{- .Name -}}</a>{{ .Post }}
                </li>
                {{- end }}
            </ul>
            {{- if ne site.Params.dark "on" }}
            <button id="theme-toggle" aria-label="Toggle theme">
                <svg class="tt-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>
                <svg class="tt-moon" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
            </button>
            {{- end }}
        </nav>
    </div>
</header>
{{- if ne site.Params.dark "on" }}
<script>
(function () {
    var btn = document.getElementById('theme-toggle');
    function effective() {
        try {
            var t = localStorage.getItem('theme');
            if (t === 'light' || t === 'dark') return t;
        } catch (e) {}
        return matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    }
    function paint(t) {
        btn.setAttribute('data-mode', t);
        btn.title = 'Switch to ' + (t === 'dark' ? 'light' : 'dark') + ' theme';
    }
    btn.addEventListener('click', function () {
        var t = effective() === 'dark' ? 'light' : 'dark';
        document.documentElement.setAttribute('data-theme', t);
        try { localStorage.setItem('theme', t); } catch (e) {}
        paint(t);
    });
    paint(effective());
})();
</script>
{{- end }}
